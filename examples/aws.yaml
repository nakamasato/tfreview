# Full example for AWS. Copy to .tfreview.yaml and edit.
#
# severity         none < medium < high < critical. An aspect scores the max of its
#                  checks; the PR scores the max of its aspects.
# match            deterministic condition. Only actions / types / targets, each a list
#                  of strings.
# verdict_on_match hit (default): match alone decides. ask: match only narrows the
#                  candidates, the judge decides; if no answer comes back, the match
#                  result stands. unverifiable: the plan cannot show this; report
#                  "unverifiable by plan" instead of "no".
# instructions     the check as a proposition. `focus` refers to the change being
#                  judged; `focus.changed_keys` are the attributes whose value changed
#                  in this plan, `focus.referred_by` the other changes that point at it.
# criteria         true: what counts. false: the complement, not more examples. A judge
#                  that answers with a score cannot note an exception, so every
#                  exclusion has to be stated here.
language: en
llm:
  provider: anthropic
  model: claude-opus-5

aspects:
  - id: resource-deletion
    title: Resource deletion
    checks:
      - id: resource-deletion
        severity: critical
        match: { actions: [delete] }
        verdict_on_match: ask
        instructions: |
          The change at `focus` removes or recreates a resource that serves requests,
          holds state, or is depended on by another change in this plan.
        criteria:
          true: >-
            the action is destroy or replace, and either `focus.referred_by` names
            another change, or the resource type is one that serves requests or stores
            data — an EC2 instance, an RDS instance, an S3 bucket, an SQS queue, an
            ALB or NLB, a Route 53 record, an ECS service, an EKS node group — or the
            resource is an authoritative aws_iam_policy body
          false: >-
            anything else, including an add or change action, and a resource type that
            only records or describes something, such as a tag, a CloudWatch alarm, a
            log group subscription, or an IAM binding whose member is a human user

      # Targets whose outputs other targets read via terraform_remote_state, and whose
      # downstream plans do not run in the same workflow. unverifiable: the plan cannot
      # show whether an output change or a replacement here breaks a downstream
      # target's terraform_remote_state read, since that plan did not run.
      - id: shared-target
        severity: critical
        match: { targets: [network-prd, shared] }
        verdict_on_match: unverifiable

      - id: request-drop
        severity: high
        instructions: |
          The change at `focus` can drop in-flight requests while it is applied.
        criteria:
          true: >-
            the action is replace on an ECS service, an ALB or NLB, a target group, a
            listener or a launch template, or `focus.changed_keys` contains
            desired_count, deployment_configuration, health_check or a target group
            attachment
          false: >-
            anything else, including a resource that serves no traffic, and a change
            that adds capacity without replacing what already serves

  - id: data-loss
    title: Data loss
    checks:
      - id: stateful-delete
        severity: critical
        match:
          actions: [delete]
          types: [aws_db_instance, aws_rds_cluster, aws_dynamodb_table, aws_s3_bucket, aws_efs_file_system, aws_elasticache_cluster]

      - id: data-loss
        severity: critical
        instructions: |
          The change at `focus` makes stored data easier to lose.
        criteria:
          true: >-
            the action is destroy or replace on a resource type that stores persistent
            data, or `focus.changed_keys` contains force_destroy, deletion_protection,
            skip_final_snapshot or backup_retention_period and `focus.after` gives that
            key its permissive value — force_destroy true, deletion_protection false,
            skip_final_snapshot true, a retention of zero
          false: >-
            anything else, including a resource type that stores nothing, a guard whose
            value in `focus.after` is the protective one, and a change with no
            `focus.changed_keys` and no destroy or replace action

  - id: polp
    title: Least privilege
    checks:
      - id: polp
        severity: high
        instructions: |
          The change at `focus` widens who can act on or reach the resource.
        criteria:
          true: >-
            a policy statement in `focus.after` confers write, delete or admin
            capability on a named principal, or contains a wildcard in an Action or a
            Resource, or a principal appears in an assume_role_policy, or
            `focus.after` admits traffic from 0.0.0.0/0 or ::/0, or a public access
            block has its blocking fields false, or a bucket policy names a wildcard
            principal
          false: >-
            anything else, including a policy that confers only read access such as
            ReadOnlyAccess or Get and List actions, ingress limited to named CIDRs or
            security group ids, and a change that touches neither permissions nor
            network reachability

  - id: cost
    title: Cost
    checks:
      - id: cost
        severity: high
        instructions: |
          The change at `focus` raises what this account is billed every month.
        criteria:
          true: >-
            the action is add on a NAT gateway, an ALB or NLB, an RDS instance, an EC2
            instance, an EKS cluster or an Elastic IP, or `focus.changed_keys` contains
            instance_class, instance_type, allocated_storage, desired_count or
            node_count
          false: >-
            anything else, including a resource billed only per request such as a
            Lambda function or an SQS queue, and a change that touches only tags,
            descriptions or names
