# Full example for Google Cloud. Copy to .tfreview.yaml and edit.
# See examples/aws.yaml for the meaning of each field.
language: en
llm:
  provider: anthropic
  model: claude-opus-5

categories:
  - id: destruction
    title: Destruction / downtime
    checks:
      - id: delete-or-replace
        level: critical
        match: { actions: [delete] }
        verdict_on_match: ask
        question: |
          Is a running resource deleted or replaced? Name it and say what becomes
          unavailable. For IAM: removing a binding from `user:` does not count;
          removing one from a `serviceAccount:` used by CI or a workload does, and so
          does replacing an authoritative `google_*_iam_policy`. Read the principal
          from the resource address (for_each key) and `after`.

      # unverifiable: the plan cannot show whether an output change or resource
      # replacement here breaks a downstream target's terraform_remote_state read,
      # since the downstream plan did not run.
      - id: shared-target
        level: critical
        match: { targets: [shared, network-prd] }
        verdict_on_match: unverifiable

      - id: cloud-run-downtime
        level: high
        question: |
          Could a Cloud Run service or load balancer backend replacement drop
          requests? Judge only from the plan (replaced resources, traffic split,
          backend re-attachment). If you cannot tell, answer unverifiable.

  - id: data-loss
    title: Data loss
    checks:
      - id: stateful-delete
        level: critical
        match:
          actions: [delete]
          types: [google_sql_database_instance, google_storage_bucket, google_bigquery_dataset, google_bigquery_table, google_spanner_instance, google_firestore_database, google_redis_instance]
        verdict_on_match: ask
        question: |
          Is a resource holding data deleted or replaced? Is there a recovery path?

      - id: guard-relaxed
        level: critical
        question: |
          Is deletion_protection, force_destroy, or a backup setting changed toward
          the side that loses data? Decide from `changed_keys` only. If there are no
          `changed_keys`, answer unverifiable.

  - id: exposure
    title: Permissions / exposure
    checks:
      - id: human-write-grant
        level: high
        question: |
          Is a write-capable role (roles/owner, roles/editor, *.admin,
          roles/iam.securityAdmin, …) granted to a `user:` principal? `serviceAccount:`
          does not count. Answer only whether it happens. Viewer roles do not count.

      - id: firewall-open
        level: high
        question: |
          Is 0.0.0.0/0 or ::/0 added to a firewall rule's source_ranges for an allow
          rule? Which ports open? Decide from `changed_keys`.

      - id: bucket-public
        level: high
        question: |
          Is allUsers or allAuthenticatedUsers granted on a bucket, or is
          public_access_prevention relaxed? Decide from `changed_keys`.

  - id: cost
    title: Cost
    checks:
      - id: recurring-charge
        level: high
        question: |
          Do recurring charges increase? Name the resource and attribute (machine
          type, tier, disk size, min instances, a new always-on resource). Do not
          state prices.
