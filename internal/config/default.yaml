# One scored check per aspect. A check is stated as a proposition in `instructions`,
# and `criteria` bounds it: `true` lists what counts, `false` states the complement
# rather than more examples. A judge that answers with a score has nowhere to note an
# exception, so anything a prose question would leave as an aside belongs in criteria.
aspects:
  - id: resource-deletion
    title: Resource deletion
    checks:
      - id: resource-deletion
        severity: critical
        match: { actions: [delete] }
        verdict_on_match: ask
        instructions: |
          The change at `focus` removes or recreates a resource that serves requests,
          holds state, or is depended on by another change in this plan.
        criteria:
          true: >-
            the action is destroy or replace, and either `focus.referred_by` names
            another change, or the resource type is one that serves requests, stores
            data or holds an identity others attach to — a compute instance, a
            database, a bucket, a queue, a load balancer, a DNS record, a node pool
          false: >-
            anything else, including an add or change action, and a resource type that
            only records or describes something, such as a tag, a monitoring alert, a
            log subscription, or an IAM binding whose member is a human user

  - id: data-loss
    title: Data loss
    checks:
      # A rule, not a proposition: the resource type and the action are the whole test,
      # and a judge adds nothing to a list membership check.
      - id: stateful-delete
        severity: critical
        match:
          actions: [delete]
          types:
            - aws_db_instance
            - aws_rds_cluster
            - aws_dynamodb_table
            - aws_s3_bucket
            - aws_efs_file_system
            - aws_elasticache_cluster
            - google_sql_database_instance
            - google_storage_bucket
            - google_bigquery_dataset
            - google_bigquery_table
            - google_spanner_instance
            - google_firestore_database
            - azurerm_storage_account
            - azurerm_mssql_database
            - azurerm_postgresql_flexible_server
            - azurerm_cosmosdb_account

      - id: data-loss
        severity: critical
        instructions: |
          The change at `focus` makes stored data easier to lose.
        criteria:
          true: >-
            the action is destroy or replace on a resource type that stores persistent
            data, or `focus.changed_keys` contains a guard such as force_destroy,
            deletion_protection, skip_final_snapshot, prevent_destroy,
            backup_retention_period or retention_policy and `focus.after` gives that
            key its permissive value — force_destroy true, deletion_protection false,
            skip_final_snapshot true, a retention of zero
          false: >-
            anything else, including a resource type that stores nothing, a guard whose
            value in `focus.after` is the protective one, and a change with no
            `focus.changed_keys` and no destroy or replace action

  - id: polp
    title: Least privilege
    checks:
      - id: polp
        severity: high
        instructions: |
          The change at `focus` widens who can act on or reach the resource.
        criteria:
          true: >-
            `focus.after` confers create, write, update, delete or admin capability on
            a named principal, or contains a wildcard in an action or a resource, or
            admits traffic from 0.0.0.0/0 or ::/0, or names allUsers,
            allAuthenticatedUsers or an anonymous principal, or turns off a public
            access block, or marks a scheme or an address public or external
          false: >-
            anything else, including access that stays read-only such as viewer,
            reader, get, list or describe, reachability limited to named CIDRs or
            private ranges, and a change that touches neither permissions nor network
            reachability

  - id: cost
    title: Cost
    checks:
      # Whether a size or count grew or shrank is not recoverable: `before` never leaves
      # the runner, so a key appearing in changed_keys is all there is. A downsize
      # therefore scores like an increase, which is why this aspect is high, not critical.
      - id: cost
        severity: high
        instructions: |
          The change at `focus` raises what this account is billed every month.
        criteria:
          true: >-
            the action is add and the resource type bills a baseline whether or not it
            is used — a NAT gateway, a load balancer, a database instance, a compute
            instance, a cluster, a reserved address — or `focus.changed_keys` contains
            an instance class, machine type, tier, storage size, node count or
            desired count
          false: >-
            anything else, including a resource billed only per request with no
            baseline, and a change that touches only tags, labels, descriptions or names
